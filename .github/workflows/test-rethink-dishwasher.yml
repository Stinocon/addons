name: "Test rethink-dishwasher"

env:
  ADDON_PATH: rethink-dishwasher

# Only on changes that concern this add-on: a commit to another add-on or to the README would
# restart a build whose outcome cannot change.
on:
  push:
    branches:
      - master
    paths:
      - 'rethink-dishwasher/**'
      - '.github/workflows/test-rethink-dishwasher.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'rethink-dishwasher/**'
      - '.github/workflows/test-rethink-dishwasher.yml'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Read add-on info from config.yaml
        id: info
        run: |
          image=$(yq e '.image' "${ADDON_PATH}/config.yaml")
          clean="${image//\{arch\}-/}"
          echo "image_name=${clean##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=docker.io/${clean%/*}" >> "$GITHUB_OUTPUT"
          echo "architectures=$(yq e -o=json -I=0 '.arch' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Test build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read add-on version
        id: info
        run: echo "version=$(yq e '.version' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"

      # The bases are architecture-specific (`{arch}-base-debian`), and the action does NOT pass
      # BUILD_FROM by itself: it has to be passed here, or one architecture pulls the other
      # one's image. The value stays in build.yaml, the single place the base is written down.
      - name: Read the base image for this architecture
        id: base
        run: |
          build_from=$(yq e ".build_from.${{ matrix.arch }}" "${ADDON_PATH}/build.yaml")
          if [ -z "${build_from}" ] || [ "${build_from}" = "null" ]; then
              echo "build.yaml has no build_from for ${{ matrix.arch }}" >&2; exit 1
          fi
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Test build (no push)
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "./${{ env.ADDON_PATH }}"
          image: ${{ matrix.image }}
          image-tags: ${{ steps.info.outputs.version }}
          version: ${{ steps.info.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
          cosign: "false"
          push: "false"
          # not used (push disabled) but required by the action schema
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
