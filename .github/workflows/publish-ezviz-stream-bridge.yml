name: "Publish ezviz-stream-bridge"

env:
  ADDON_PATH: ezviz-stream-bridge

# Niente `release: [published]` e niente tag generico `addon-*`: in un repository con più
# addon quei trigger pubblicano anche quello che non c'entra. Il tag è specifico.
on:
  workflow_dispatch:
  push:
    tags:
      - 'ezviz-stream-bridge-*'

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.info.outputs.version }}
      name: ${{ steps.info.outputs.name }}
      description: ${{ steps.info.outputs.description }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Read add-on info from config.yaml
        id: info
        run: |
          image=$(yq e '.image' "${ADDON_PATH}/config.yaml")
          clean="${image//\{arch\}-/}"
          echo "image_name=${clean##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=docker.io/${clean%/*}" >> "$GITHUB_OUTPUT"
          echo "architectures=$(yq e -o=json -I=0 '.arch' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"
          echo "version=$(yq e '.version' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"
          echo "name=$(yq e '.name' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"
          echo "description=$(yq e '.description' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Publish ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Nessuno step di pulizia disco come in reel2recipe: qui l'immagine è ffmpeg più
      # qualche wheel Python, e lo spazio del runner basta con ampio margine.

      # Le basi di questo addon sono arch-specific (`{arch}-base-debian`), e l'action NON passa
      # BUILD_FROM da sé: va passato qui, o buildx usa il default del Dockerfile e su una delle
      # due architetture tira giù l'immagine dell'altra. Il valore resta in build.yaml, che
      # rimane l'unico posto dove la base è scritta.
      - name: Read the base image for this architecture
        id: base
        run: |
          build_from=$(yq e ".build_from.${{ matrix.arch }}" "${ADDON_PATH}/build.yaml")
          if [ -z "${build_from}" ] || [ "${build_from}" = "null" ]; then
              echo "build.yaml has no build_from for ${{ matrix.arch }}" >&2; exit 1
          fi
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "./${{ env.ADDON_PATH }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          version: ${{ needs.prepare.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
          cosign: "false"
          push: "true"
          container-registry: docker.io
          container-registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          container-registry-password: ${{ secrets.DOCKERHUB_TOKEN }}
