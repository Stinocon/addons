name: "Test sbfspot-mqtt"

env:
  ADDON_PATH: sbfspot-mqtt

# Only on changes that concern this add-on: without the filter, a commit to another add-on or to
# the README would restart a build that cannot change its outcome.
on:
  push:
    branches:
      - master
    paths:
      - 'sbfspot-mqtt/**'
      - '.github/workflows/test-sbfspot-mqtt.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'sbfspot-mqtt/**'
      - '.github/workflows/test-sbfspot-mqtt.yml'

permissions:
  contents: read

jobs:
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # jq and shellcheck are already on the runner. The broker is the one the package ships,
      # reconfigured to accept anonymous connections instead of being replaced: whichever way the
      # runner starts services, the broker on 1883 ends up being this one. The loop is what makes
      # a red run say "broker" rather than send a later assertion looking for the cause.
      - name: Install jq, shellcheck and a broker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq mosquitto mosquitto-clients shellcheck
          sudo mkdir -p /etc/mosquitto/conf.d
          printf 'listener 1883 127.0.0.1\nallow_anonymous true\n' | sudo tee /etc/mosquitto/conf.d/zz-test.conf > /dev/null
          sudo systemctl restart mosquitto || sudo mosquitto -c /etc/mosquitto/mosquitto.conf -d
          for _ in $(seq 1 20); do
            if mosquitto_pub -h localhost -t smoke -m ok 2> /dev/null; then
              echo "broker accepting anonymous connections on 1883"
              exit 0
            fi
            sleep 1
          done
          echo "no broker on 1883 after 20 seconds; what is there:"
          ss -lntp | grep 1883 || true
          ps aux | grep -i '[m]osquitto' || true
          sudo tail -30 /var/log/mosquitto/mosquitto.log || true
          exit 1

      # Static, and it covers the two s6 scripts too, which cannot be run outside the image.
      - name: shellcheck
        run: |
          shellcheck \
            "${ADDON_PATH}"/rootfs/etc/services.d/sbfspot-mqtt/* \
            "${ADDON_PATH}"/rootfs/usr/bin/sbfspot-mqtt/*.sh \
            "${ADDON_PATH}"/tests/*.sh

      # Behaviour, against the broker above. This is the half that the image build cannot check:
      # the image is built and never run, and this add-on has no application repository whose CI
      # would otherwise exercise its scripts.
      - name: Add-on script tests
        run: "${ADDON_PATH}/tests/glue.sh"

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      - name: Read add-on info from config.yaml
        id: info
        run: |
          image=$(yq e '.image' "${ADDON_PATH}/config.yaml")
          clean="${image//\{arch\}-/}"
          echo "image_name=${clean##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=docker.io/${clean%/*}" >> "$GITHUB_OUTPUT"
          echo "architectures=$(yq e -o=json -I=0 '.arch' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"

      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.info.outputs.image_name }}
          registry-prefix: ${{ steps.info.outputs.registry_prefix }}

  build:
    name: Test build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read add-on version
        id: info
        run: echo "version=$(yq e '.version' "${ADDON_PATH}/config.yaml")" >> "$GITHUB_OUTPUT"

      # This add-on's bases are architecture-specific (`{arch}-base-debian`), and the action does
      # NOT pass BUILD_FROM by itself: without this step buildx falls back to the Dockerfile's
      # default and one architecture pulls the other one's base image. The value stays in
      # build.yaml, which remains the only place the base is written down.
      - name: Read the base image for this architecture
        id: base
        run: |
          build_from=$(yq e ".build_from.${{ matrix.arch }}" "${ADDON_PATH}/build.yaml")
          if [ -z "${build_from}" ] || [ "${build_from}" = "null" ]; then
              echo "build.yaml has no build_from for ${{ matrix.arch }}" >&2; exit 1
          fi
          echo "build_from=${build_from}" >> "$GITHUB_OUTPUT"

      # This is where the Dockerfile's own checks run: SBFspot is compiled from a pinned upstream
      # tag, the resulting binary has to execute, and `ldd` has to find every library it needs. A
      # boost runtime package missing on one architecture turns this job red instead of leaving an
      # add-on that starts and dies at the first poll.
      - name: Test build (no push)
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: "./${{ env.ADDON_PATH }}"
          image: ${{ matrix.image }}
          image-tags: ${{ steps.info.outputs.version }}
          version: ${{ steps.info.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.build_from }}
          cosign: "false"
          push: "false"
          # not used (push disabled) but required by the action schema
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
