name: "Reel2Recipe"
url: https://github.com/Stinocon/addons/tree/master/reel2recipe
version: "1.0.5"
slug: reel2recipe
description: "Extracts recipes from cooking reels and exports them in Mela format. Whisper and the LLM run inside the add-on: no paid AI, no API key, no data leaving the machine."

# amd64 only. Inference for a 14-billion-parameter model runs on the CPU: it needs a miniPC
# with 16 GB of RAM, not a Raspberry. Publishing an aarch64 image would mean letting somebody
# install an add-on that on their machine will never finish a recipe.
arch:
  - amd64

init: false
startup: application
boot: auto

# The interface goes through the Ingress: it appears in Home Assistant's sidebar and does not
# require opening a port. The port stays mappable for anyone who wants it directly.
ingress: true
ingress_port: 8500
panel_icon: mdi:chef-hat
panel_title: Reel2Recipe
ports:
  8500/tcp: null
ports_description:
  8500/tcp: "Direct web interface (optional: the Ingress is normally enough)"

# Read-only, and it serves one purpose: reading the cookie file for the reels that require
# being logged in. Nothing is written to /share.
map:
  - share:ro

# The models live on /data because they have to survive add-on updates, but they must not end
# up in Home Assistant's backups: they are some ten GB that can be downloaded again, and a
# backup containing them becomes unusable.
backup_exclude:
  - ollama/**
  - whisper/**
  - workspace/media/**

options:
  modello_llm: qwen2.5:14b
  scarica_modello: true
  file_cookie: ""
  log_level: info

schema:
  modello_llm: str
  scarica_modello: bool
  file_cookie: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)

image: stfncntr/{arch}-addon-reel2recipe
